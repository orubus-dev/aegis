name: android-build

on:
  push:
    branches: [main, vxp]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with Launcher3 submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build AOSP debug APK
        working-directory: VirtualApp
        run: ./gradlew :app:assembleAospDebug --stacktrace --no-daemon

      - name: Build F-Droid debug APK
        working-directory: VirtualApp
        run: ./gradlew :app:assembleFdroidDebug --stacktrace --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p apks
          find VirtualApp/app/build/outputs/apk -name "*.apk" -exec cp {} apks/ \;
          ls -la apks

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aegis-debug-apks
          path: apks/*.apk
