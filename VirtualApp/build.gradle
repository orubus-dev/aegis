// Aegis fork — modernized build (AGP 7.4.2: last line that still accepts the
// legacy android.support libraries used by the engine + Launcher3).
buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        jcenter() // read-only legacy mirror; still serves me.weishu.* engine deps
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.8.19'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.google.com/' }
        maven { url 'https://jitpack.io' }
        jcenter() // read-only legacy mirror
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
