apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// Aegis release signing
//
// CI (release.yml) provides the keystore via environment variables:
//   AEGIS_KEYSTORE_BASE64     base64 of the release keystore
//   AEGIS_KEYSTORE_PASSWORD   keystore password
//   AEGIS_KEY_ALIAS           key alias
//   AEGIS_KEY_PASSWORD        key password
//
// Local development falls back to the debug keystore so `assembleAospRelease`
// always produces an installable APK even without the secrets present.
// ---------------------------------------------------------------------------
def keystoreB64 = System.getenv("AEGIS_KEYSTORE_BASE64")
def keystorePass = System.getenv("AEGIS_KEYSTORE_PASSWORD")
def keyAliasEnv = System.getenv("AEGIS_KEY_ALIAS")
def keyPassEnv = System.getenv("AEGIS_KEY_PASSWORD")
def ciSigning = keystoreB64 != null && !keystoreB64.trim().isEmpty()
        && keystorePass != null && !keystorePass.trim().isEmpty()

android {
    signingConfigs {
        aegisRelease {
            if (ciSigning) {
                def ksFile = new File(project.buildDir, "signing/aegis-release.jks")
                ksFile.parentFile.mkdirs()
                ksFile.bytes = new String(keystoreB64).decodeBase64()
                storeFile ksFile
                storePassword keystorePass
                keyAlias (keyAliasEnv ?: "aegis")
                keyPassword (keyPassEnv ?: keystorePass)
            } else {
                // local fallback: debug keystore, so release builds install
                storeFile debug.storeFile
                storePassword debug.storePassword
                keyAlias debug.keyAlias
                keyPassword debug.keyPassword
            }
        }
    }

    compileSdkVersion 28
    defaultConfig {
        applicationId "app.orubus.aegis"
        minSdkVersion 21
        targetSdkVersion 24
        versionCode 301
        versionName "1.0.0"
        multiDexEnabled false
        android {
            defaultConfig {
                ndk {
                    abiFilters "arm64-v8a", "x86_64"
                }
            }
        }
    }
    // https://developer.android.com/studio/build/gradle-plugin-3-0-0-migration.html?utm_source=android-studio
    flavorDimensions 'main'
    productFlavors {
        aosp {
            dimension 'main'
            //matchingFallbacks ['aosp']
        }

        fdroid {
            dimension 'main'
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.aegisRelease
        }
        debug {
            // keep upstream behavior; debug builds sign with the debug key
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':lib')
    implementation project(':launcher')
    //Android Lib
    implementation 'com.android.support:multidex:1.0.3'
    implementation 'com.android.support:appcompat-v7:27.1.1'
    implementation 'com.android.support:recyclerview-v7:27.1.1'
    implementation 'com.android.support:design:27.1.1'
    //Promise Support
    implementation 'org.jdeferred:jdeferred-android-aar:1.2.4'
    // ThirdParty
    implementation 'com.jonathanfinerty.once:once:1.0.3'

    def appCenterSdkVersion = '3.0.0'
    aospImplementation("com.microsoft.appcenter:appcenter-analytics:${appCenterSdkVersion}")
    aospImplementation("com.microsoft.appcenter:appcenter-crashes:${appCenterSdkVersion}")

    implementation 'com.kyleduo.switchbutton:library:1.4.6'
    implementation 'com.allenliu.versionchecklib:library:1.8.3'
    implementation 'com.github.medyo:android-about-page:1.2.2'

    //Glide
    implementation ('com.github.bumptech.glide:glide:4.8.0') {
        exclude(group: "com.android.support")
    }
    annotationProcessor 'com.github.bumptech.glide:compiler:4.8.0'
}
