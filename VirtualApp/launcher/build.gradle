// Plugins come from the root buildscript (AGP 7.4.2 + protobuf 0.8.19).

apply plugin: 'com.android.library'
apply plugin: 'com.google.protobuf'

android {
    // 27 on purpose: Canvas.*_SAVE_FLAG constants still exist here; they were
    // removed from API 28 stubs and the AOSP drawing code depends on them.
    compileSdkVersion 27

    defaultConfig {
        // No minSdk was declared upstream -> AGP defaulted to 1 and tried to
        // pre-render the AOSP theme-attr vectors to PNG for API < 21 and died.
        // The engine min is 21 (native vector support), so PNG gen never runs.
        minSdkVersion 21
        targetSdkVersion 27
        versionCode 30907
        versionName "3.9"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        debug {
            minifyEnabled false
        }

//        optimized {
//            initWith debug
//            minifyEnabled true
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
//                    'proguard.flags'
//        }
    }

    flavorDimensions 'lib'

    productFlavors {
        aosp {
            dimension 'lib'
//            applicationId 'com.google.android.apps.nexuslauncher'
//            testApplicationId 'com.android.launcher3.tests'
        }

//        l3go {
//            dimension 'lib'
//            applicationId 'com.android.launcher3'
//            testApplicationId 'com.android.launcher3.tests'
//        }
    }
    sourceSets {
        main {
            res.srcDirs = ['res']
            java.srcDirs = ['src']
            aidl.srcDirs = ['src']
            assets.srcDirs = ['assets']
            manifest.srcFile 'AndroidManifest-common.xml'
            proto {
                srcDir 'protos/'
                srcDir 'proto_overrides/'
                srcDir 'proto_pixel/'
            }
        }

        androidTest {
            res.srcDirs = ['tests/res']
            java.srcDirs = ['tests/src']
            manifest.srcFile "tests/AndroidManifest-common.xml"
        }

        aosp {
            java.srcDirs = ['src_flags']
            manifest.srcFile "AndroidManifest.xml"
        }

//        aospAndroidTest {
//            manifest.srcFile "tests/AndroidManifest.xml"
//        }

//        l3go {
//            res.srcDirs = ['go/res']
//            java.srcDirs = ['go/src_flags']
//            // Note: we are using the Launcher3 manifest here because the gradle manifest-merger uses
//            // different attributes than the build system.
//            manifest.srcFile "AndroidManifest.xml"
//        }

//        l3goAndroidTest {
//            manifest.srcFile "tests/AndroidManifest.xml"
//        }
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    mavenCentral()
    jcenter()
    google()
}

final String SUPPORT_LIBS_VERSION = '27.1.1'
dependencies {
    implementation project(":lib")
    implementation "com.android.support:support-v4:${SUPPORT_LIBS_VERSION}"
    implementation "com.android.support:support-dynamic-animation:${SUPPORT_LIBS_VERSION}"
    implementation "com.android.support:recyclerview-v7:${SUPPORT_LIBS_VERSION}"
    implementation "com.android.support:palette-v7:${SUPPORT_LIBS_VERSION}"
    implementation 'com.google.protobuf.nano:protobuf-javanano:3.2.0rc2'

    testImplementation 'junit:junit:4.12'
    androidTestImplementation "org.mockito:mockito-core:1.10.19"
    androidTestImplementation 'com.google.dexmaker:dexmaker:1.2'
    androidTestImplementation 'com.google.dexmaker:dexmaker-mockito:1.2'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.uiautomator:uiautomator-v18:2.1.3'
    androidTestImplementation "com.android.support:support-annotations:${SUPPORT_LIBS_VERSION}"
}

protobuf {
    // Configure the protoc executable
    protoc {
        artifact = 'com.google.protobuf:protoc:3.5.1'

        generateProtoTasks {
            all().each { task ->
                task.builtins {
                    remove java
                    javanano {
                        option "java_package=launcher_log_extension.proto|com.android.launcher3.userevent.nano"
                        option "java_package=launcher_log.proto|com.android.launcher3.userevent.nano"
                        option "java_package=launcher_dump.proto|com.android.launcher3.model.nano"
                        option "java_package=search.proto|com.google.android.apps.nexuslauncher.search.nano"
                        option "java_package=smartspace.proto|com.google.android.apps.nexuslauncher.smartspace.nano"
                        option "enum_style=java"
                    }
                }
            }
        }
    }
}
